# Ruslan builds the vendored coworld-vanilla-wow reference player
# (persistent-wow-e30, commit b8b551f28f — the andre-wow-walker:v82
# lineage). The engine is vendored ONCE, under
# games/vanilla-wow/bova/vendor/, and shared by both wow policies.
# Paths are relative to this file, so the same cfg serves local
# `nim check` and the Docker build (which reproduces the repo-relative
# layout). Flags mirror the upstream wow-walker-persistent Dockerfile
# plus its config.nims; -d:release is added by the Dockerfile only.
--path:"../../vanilla-wow/bova/vendor/coworld"
--path:"../../vanilla-wow/bova/vendor/coworld/player"

--path:"../../vanilla-wow/bova/vendor/deps/silky/src"
--path:"../../vanilla-wow/bova/vendor/deps/windy/src"
--path:"../../vanilla-wow/bova/vendor/deps/pixie/src"
--path:"../../vanilla-wow/bova/vendor/deps/chroma/src"
--path:"../../vanilla-wow/bova/vendor/deps/vmath/src"
--path:"../../vanilla-wow/bova/vendor/deps/flatty/src"
--path:"../../vanilla-wow/bova/vendor/deps/zippy/src"
--path:"../../vanilla-wow/bova/vendor/deps/crunchy/src"
--path:"../../vanilla-wow/bova/vendor/deps/checksums/src"
--path:"../../vanilla-wow/bova/vendor/deps/nimcrypto"
--path:"../../vanilla-wow/bova/vendor/deps/stew"
--path:"../../vanilla-wow/bova/vendor/deps/shady/src"
--path:"../../vanilla-wow/bova/vendor/deps/opengl/src"
--path:"../../vanilla-wow/bova/vendor/deps/webby/src"
--path:"../../vanilla-wow/bova/vendor/deps/bumpy/src"
--path:"../../vanilla-wow/bova/vendor/deps/nimsimd/src"
--path:"../../vanilla-wow/bova/vendor/deps/urlly/src"
--path:"../../vanilla-wow/bova/vendor/deps/ws/src"
--path:"../../vanilla-wow/bova/vendor/deps/jsony/src"
--path:"../../vanilla-wow/bova/vendor/deps/dx12/src"
--path:"../../vanilla-wow/bova/vendor/deps/metal4/src"
--path:"../../vanilla-wow/bova/vendor/deps/vk14/src"
--path:"../../vanilla-wow/bova/vendor/deps/fluffy/src"
--path:"../../vanilla-wow/bova/vendor/deps/wololo/src"
--path:"../../vanilla-wow/bova/vendor/deps/xr/src"
--path:"../../vanilla-wow/bova/vendor/deps/db_connector/src"
--path:"../../vanilla-wow/bova/vendor/deps/waterpark/src"
--path:"../../vanilla-wow/bova/vendor/deps/x11"

# From the vendored config.nims (not read when the project file lives
# outside vendor/coworld): replay checkpoints clone the retained reducer
# graph, and the renderer owns GL failure recovery explicitly.
--deepcopy:on
--define:noAutoGLerrorCheck

# Upstream walker_builder flags (canonical no-GUI hosted session build).
--define:noGui
--define:useWs
--define:simulationDataHttp
--define:ssl
--define:nimTypeNames
--stackTrace:on
--lineTrace:on
--define:"httpAssets=/player/assets"
