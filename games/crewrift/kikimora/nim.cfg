# Local dev config for the Kikimora crewrift policy: the vendored
# truecrew bot builds against the crewrift sim, bitworld sprite
# protocol, and pathy JPS pathing. The Docker build regenerates this
# file from a nimby --global sync of nimby.lock, so these paths only
# matter for local `nim check`.
#
# botHeadless matches the shipped build (no windy/silky GUI viewer).
--define:botHeadless
--define:ssl
--threads:on
--mm:orc
--path:"/Users/me/p/coworld-crewrift/src"
--path:"/Users/me/p/bitworld/src"
--path:"/Users/me/p/pathy/src"
--path:"/Users/me/.nimby/pkgs/whisky/src"
--path:"/Users/me/.nimby/pkgs/pixie/src"
--path:"/Users/me/.nimby/pkgs/chroma/src"
--path:"/Users/me/.nimby/pkgs/vmath/src"
--path:"/Users/me/.nimby/pkgs/flatty/src"
