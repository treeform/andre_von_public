# Local dev config for the Pudge Wars replay tools: they re-simulate
# league tapes with the vendored polyworld engine (sims/pudge-wars).
# The engine's own config.nims resolves its deps as sibling checkouts
# (../vmath/src ...), so point at the ~/p checkouts that sit on the
# exact nimby.lock commits (flatty 9c3f14c, vmath 1b6080f, zippy
# cd562ba, noisy 9625ee0, fluffy 5e5f90a). flatty64 mirrors the game
# build: the tape's Flatty payload was written with 64-bit ints.
--path:"../../../sims/pudge-wars/src"
--path:"../../../sims/pudge-wars/examples/pudge_wars"
--path:"/Users/me/p/flatty/src"
--path:"/Users/me/p/vmath/src"
--path:"/Users/me/p/zippy/src"
--path:"/Users/me/p/noisy/src"
--path:"/Users/me/p/fluffy/src"
--define:flatty64
--define:release
--mm:orc
